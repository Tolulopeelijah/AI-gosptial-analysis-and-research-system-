# Render Blueprint for the Flask GIS API.
# If the web service is Blueprint-connected, this keeps the start command
# (notably gunicorn --timeout) in sync with the repo. Manual dashboard
# services are unaffected unless adopted as a Blueprint.
services:
  - type: web
    name: ai-gosptial-analysis-and-research-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
